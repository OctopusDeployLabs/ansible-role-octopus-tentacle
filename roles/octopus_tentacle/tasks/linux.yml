---
- name: Install and configure Octopus Tentacle on Linux
  become: true
  block:
    - name: Preflight checks and derived settings
      ansible.builtin.import_tasks: preflight.yml

    - name: Service user and directories
      ansible.builtin.import_tasks: user.yml

    - name: Tentacle binaries
      ansible.builtin.import_tasks: install.yml

    - name: SELinux labels
      ansible.builtin.import_tasks: selinux.yml
      when: tentacle_manage_selinux | bool

    - name: Rootless Tentacle instance
      ansible.builtin.import_tasks: configure.yml

    - name: Registration with Octopus Server
      ansible.builtin.import_tasks: register.yml

    - name: Firewall
      ansible.builtin.import_tasks: firewall.yml
      when: tentacle_manage_firewall | bool

    - name: Systemd service
      ansible.builtin.import_tasks: service.yml
      when: tentacle_manage_service | bool
