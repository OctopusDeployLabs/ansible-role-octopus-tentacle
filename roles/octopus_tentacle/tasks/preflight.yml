---
- name: Check this is a supported RHEL-family host
  ansible.builtin.assert:
    that:
      - ansible_os_family == "RedHat"
      - (ansible_distribution_major_version | string) in _tentacle_supported_os_majors
    fail_msg: >-
      This role supports RHEL 7, 8 and 9 (and rebuilds such as Rocky or Alma).
      Found {{ ansible_distribution }} {{ ansible_distribution_version }}.
    quiet: true

- name: Check the CPU architecture is supported
  ansible.builtin.assert:
    that: ansible_architecture in _tentacle_arch_map
    fail_msg: "Unsupported architecture {{ ansible_architecture }}."
    quiet: true

- name: Check the user is not root
  ansible.builtin.assert:
    that: tentacle_user != "root"
    fail_msg: This role exists to run Tentacle as a non-root user. Pick another tentacle_user.
    quiet: true

- name: Check the server thumbprint is set
  ansible.builtin.assert:
    that: tentacle_server_thumbprint | length > 0
    fail_msg: Set tentacle_server_thumbprint. A listening Tentacle needs it to trust your Octopus Server.
    quiet: true

- name: Check registration settings
  ansible.builtin.assert:
    that:
      - tentacle_registration_type in ["target", "worker"]
      - tentacle_registration_type != "target" or tentacle_environments | length > 0
      - tentacle_registration_type != "target" or tentacle_roles | length > 0
      - tentacle_registration_type != "worker" or tentacle_worker_pools | length > 0
    fail_msg: >-
      A deployment target needs at least one tentacle_environments entry and one
      tentacle_roles entry. A worker needs at least one tentacle_worker_pools entry.
    quiet: true
  when: _tentacle_do_register | bool
  vars:
    _tentacle_do_register: "{{ tentacle_register | bool and tentacle_server_url | length > 0 and tentacle_api_key | length > 0 }}"

- name: Pick the Tentacle version and architecture
  ansible.builtin.set_fact:
    _tentacle_version: "{{ tentacle_version if tentacle_version | length > 0 else tentacle_version_by_os_major[ansible_distribution_major_version | string] }}"
    _tentacle_arch: "{{ _tentacle_arch_map[ansible_architecture] }}"

- name: Warn if the RHEL 7 version has been overridden
  ansible.builtin.debug:
    msg: >-
      RHEL 7 host is set to Tentacle {{ _tentacle_version }}. Newer Tentacle
      releases may not start on RHEL 7; 8.1.2007 is the tested version.
  when:
    - (ansible_distribution_major_version | string) == "7"
    - _tentacle_version != tentacle_version_by_os_major["7"]
