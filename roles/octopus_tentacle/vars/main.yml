---
_tentacle_supported_os_majors: ["7", "8", "9", "10"]
_tentacle_arch_map:
  x86_64: x64
  aarch64: arm64
  armv7l: arm
_tentacle_semanage_package:
  "7": policycoreutils-python
  "8": policycoreutils-python-utils
  "9": policycoreutils-python-utils
  "10": policycoreutils-python-utils
# A single backslash, so Windows paths and DOMAIN\user names can be built
# without backslash escapes inside Jinja expressions.
_tentacle_bs: '\'
