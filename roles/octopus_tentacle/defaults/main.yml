---
# ---------------------------------------------------------------------------
# Service account. Tentacle runs as this user, never as root.
# ---------------------------------------------------------------------------
tentacle_user: octopus
tentacle_group: "{{ tentacle_user }}"
# Set to false if the account already exists (for example an LDAP/AD account).
tentacle_create_user: true
tentacle_user_shell: /bin/bash

# ---------------------------------------------------------------------------
# Tentacle version.
# Leave tentacle_version empty to pick the version for the host's RHEL major
# version from tentacle_version_by_os_major. Set it to override for a host.
# "latest" downloads the current release, but it only installs when Tentacle is
# missing. Pin a real version number if you want Ansible to manage upgrades.
# ---------------------------------------------------------------------------
tentacle_version: ""
tentacle_version_by_os_major:
  "7": "8.1.2007"   # newest Tentacle that runs on RHEL 7
  "8": "latest"
  "9": "latest"
  "10": "latest"

# Re-extract the archive even if the installed version already matches.
tentacle_force_reinstall: false

# Download source. The role fills in {version} and {arch}. This path works
# for both 8.1.2007 (RHEL 7) and 9.2.3995 builds.
tentacle_download_url_template: "https://download.octopusdeploy.com/linux-tentacle/tentacle-{version}-linux_{arch}.tar.gz"
tentacle_download_url_latest: "https://octopus.com/downloads/latest/Linux_{arch}TarGz/OctopusTentacle"
# Set to a full URL to use an internal mirror (Artifactory, Nexus, Satellite).
tentacle_download_url: ""
# Or set to a .tar.gz path on the Ansible controller to push it from there
# (for hosts with no internet access).
tentacle_archive_local_path: ""

# ---------------------------------------------------------------------------
# Paths. Empty means "derive from the service user's home directory":
#   <home>/apps/octopus/tentacle                 binaries
#   <home>/apps/octopus/instances/<instance>     Tentacle.config (rootless)
#   <home>/apps/octopus/applications/<instance>  deployed packages
# ---------------------------------------------------------------------------
tentacle_base_dir: ""
tentacle_app_dir: ""

# ---------------------------------------------------------------------------
# Instance (Listening mode).
# ---------------------------------------------------------------------------
tentacle_instance_name: default
tentacle_listen_port: 10933
# Thumbprint of the Octopus Server certificate. Required: a listening Tentacle
# only accepts connections from servers it trusts.
tentacle_server_thumbprint: ""

# ---------------------------------------------------------------------------
# Registration with Octopus Server (optional).
# Registration runs when tentacle_register is true and URL + API key are set.
# The API key can be plain text here, an extra var (-e), Ansible Vault, or an
# AAP custom credential. All of these end up in this one variable.
# ---------------------------------------------------------------------------
tentacle_register: true
tentacle_server_url: ""
tentacle_api_key: ""
tentacle_space: Default
# "target" (deployment target) or "worker"
tentacle_registration_type: target
tentacle_machine_name: "{{ ansible_hostname }}"
# Address the Octopus Server uses to reach this machine.
# Set tentacle_public_hostname to force a value (usually per host).
# Otherwise the role picks one using tentacle_public_hostname_source:
#   auto          FQDN if the host reports a dotted name, else its primary IPv4 address
#   fqdn          what the host reports as its fully qualified name
#   hostname      short hostname, plus tentacle_public_hostname_suffix if set
#   inventory     the host's name in the Ansible inventory, plus the suffix
#   ansible_host  the address Ansible itself connected to
#   ip            the host's primary IPv4 address (no DNS needed)
tentacle_public_hostname: ""
tentacle_public_hostname_source: auto
# For example ".corp.example.com" with the hostname or inventory source.
tentacle_public_hostname_suffix: ""
tentacle_environments: []
tentacle_roles: []
tentacle_tenants: []
tentacle_tenant_tags: []
# Untenanted, Tenanted or TenantedOrUntenanted. Empty leaves the server default.
tentacle_tenanted_deployment_participation: ""
tentacle_worker_pools: []
tentacle_machine_policy: ""
# Register again even if the settings have not changed.
tentacle_force_register: false

# ---------------------------------------------------------------------------
# Host setup done as root.
# ---------------------------------------------------------------------------
tentacle_install_dependencies: true
tentacle_dependency_packages:
  - tar
  - gzip
  - libicu
  - krb5-libs
  - openssl-libs
  - zlib
  - libstdc++
tentacle_manage_selinux: true
tentacle_manage_firewall: false
tentacle_manage_service: true
tentacle_service_name: "octopus-tentacle-{{ tentacle_instance_name }}"

# ---------------------------------------------------------------------------
# Windows hosts. Shared settings above (tentacle_user, tentacle_create_user,
# tentacle_listen_port, tentacle_server_thumbprint, registration and public
# hostname settings) apply to Windows too. The settings below are Windows only.
# ---------------------------------------------------------------------------
# Password for tentacle_user. Required for a local account (created by the
# role) or a domain account. Leave empty for a gMSA ("DOMAIN\name$").
tentacle_windows_service_password: ""
# Set to true for one run after changing the password, to push it to the service.
tentacle_windows_service_password_changed: false

# Tentacle build: "net8" (.NET 8, no .NET Framework needed) or "netfx"
# (.NET Framework build, needs .NET Framework 4.8). When Octopus ships a build
# for a newer .NET, add it to tentacle_windows_msi_url_templates (for example
# a "net10" key) and set this to its name. The role treats every modern .NET
# build as one family, so moving from net8 to a newer one is a normal upgrade.
tentacle_windows_flavour: net8
# Pin a version so Ansible can manage upgrades. "latest" uses the Octopus
# permalink and only installs when Tentacle is missing.
tentacle_windows_version: "12.3.4629"
tentacle_windows_msi_url_templates:
  net8: "https://download.octopusdeploy.com/octopus/Octopus.Tentacle.{version}-net8.0-windows-win-x64.msi"
  netfx: "https://download.octopusdeploy.com/octopus/Octopus.Tentacle.{version}-x64.msi"
tentacle_windows_msi_url_latest: "https://octopus.com/downloads/latest/WindowsX64/OctopusTentacle"
# Full URL to an internal mirror, or a path to an MSI on the controller.
tentacle_windows_msi_url: ""
tentacle_windows_msi_local_path: ""
tentacle_windows_force_reinstall: false
# Tentacle binaries are shared by every instance on a host. When other
# instances exist, the role won't install a different version unless this is true.
tentacle_windows_allow_shared_upgrade: false

tentacle_windows_instance_name: Tentacle
tentacle_windows_install_dir: 'C:\Program Files\Octopus Deploy\Tentacle'
tentacle_windows_home_dir: 'C:\Octopus'
# Empty means <home>\Applications
tentacle_windows_app_dir: ""
tentacle_windows_firewall_rule_name: "Octopus Deploy Tentacle ({{ tentacle_windows_instance_name }})"

# Optional: install PowerShell 7 so Octopus steps can use it. Ansible itself
# always manages Windows through the built-in Windows PowerShell 5.1.
tentacle_windows_install_pwsh: false
tentacle_windows_pwsh_msi_url: "https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/PowerShell-7.4.6-win-x64.msi"
