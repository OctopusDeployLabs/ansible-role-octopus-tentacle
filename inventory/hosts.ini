# Example inventory. Uncomment and edit the lines for your own machines.

# Linux hosts. ansible_user is the SSH login, which needs sudo.
[tentacles]
# linux-app01 ansible_host=linux-app01.corp.example.com ansible_user=deploy
# linux-app02 ansible_host=linux-app02.corp.example.com ansible_user=deploy

# Per-host overrides go on the host line or in inventory/host_vars/<name>.yml,
# for example:  linux-app02 ... tentacle_version=9.2.3995

# Windows hosts. Connection settings are in inventory/group_vars/windows_tentacles.yml.
[windows_tentacles]
# win-app01 ansible_host=win-app01.corp.example.com ansible_user=Administrator
# For a domain account, use the UPN or double the backslash (INI drops a single one):
#   ansible_user=administrator@corp.example.com   or   ansible_user=CORP\\Administrator

# Windows hosts get the shared settings in group_vars/tentacles.yml too.
[tentacles:children]
windows_tentacles
