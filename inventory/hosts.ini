# One line per machine. ansible_user is the SSH login, which needs sudo.
[tentacles]
rhel7test01 ansible_host=192.168.1.50 ansible_user=admin
# rhel8test01 ansible_host=192.168.1.51 ansible_user=admin
# rhel9test01 ansible_host=192.168.1.52 ansible_user=admin

# Per-host overrides go on the host line or in inventory/host_vars/<name>.yml,
# for example:  rhel9test01 ... tentacle_version=9.2.3995

# Windows hosts. Connection settings are in inventory/group_vars/windows_tentacles.yml.
[windows_tentacles]
# win2025test01 ansible_host=192.168.1.60 ansible_user=Administrator
# For a domain account, use the UPN or double the backslash (INI drops a single one):
#   ansible_user=administrator@corp.example.com   or   ansible_user=CORP\\Administrator

# Windows hosts get the shared settings in group_vars/tentacles.yml too.
[tentacles:children]
windows_tentacles
